[project]
name = "vietnamese-legal-rag"
version = "0.1.0"
description = "Vietnamese Legal RAG Assistant project skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
rag = ["langchain-core>=1,<2", "python-dotenv>=1,<2"]
test = ["jsonschema[format]>=4.25,<5"]
retrieval = ["bm25s>=0.3,<0.4", "underthesea>=9,<10"]

[tool.setuptools.packages.find]
include = ["team1_data*", "team2_rag*"]
