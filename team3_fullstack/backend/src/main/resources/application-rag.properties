# v2.0 profile: PostgreSQL/JDBC persistence, public SSE, internal HTTP JSON.
# Legacy placeholder JpaRepositories are not JPA entities and are intentionally not scanned.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_rag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:legal_rag}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.connection-timeout=2000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/chat-schema.sql
spring.mvc.async.request-timeout=55s
app.rag.base-url=${RAG_BASE_URL:http://localhost:8001}
app.rag.timeout-ms=50000
app.chat.workers=8
app.chat.heartbeat-ms=10000
